<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF viewer · SmartSense ONE</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="mock-shell.css" />
  <script src="https://unpkg.com/lucide@0.468.0"></script>
</head>
<body>
<div class="ss-app">
  <header class="ss-topbar" role="banner">
    <button type="button" class="ss-hamburger" aria-label="Open navigation" aria-expanded="false">
      <i data-lucide="menu" width="18" height="18" stroke-width="1.4"></i>
    </button>
    <div class="ss-brand">
      <span class="ss-brand-mark" aria-hidden="true">S</span>
      SmartSense ONE
    </div>
    <span class="ss-topbar-divider" aria-hidden="true"></span>
    <span class="ss-topbar-title">Information</span>
    <div class="ss-topbar-spacer"></div>
    <span class="ss-topbar-avatar" title="Jim Jensen" aria-label="Account">
      <i data-lucide="user" width="16" height="16" stroke-width="1.4"></i>
    </span>
  </header>

  <div class="ss-main">

    <div class="ss-page">
      <div class="ss-viewer-frame">
        <div class="ss-viewer-toolbar">
          <a class="ss-icon-btn" href="information-category.html" aria-label="Back"><i data-lucide="arrow-left" width="16" height="16" stroke-width="1.4"></i></a>
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--ss-fg-heading);">Employee handbook 2026</div>
            <div style="font-size:11px;color:var(--ss-fg-secondary);">PDF · Corporate best practices / Handbooks</div>
          </div>
          <div class="ss-ml-auto ss-flex ss-gap-1">
            <button type="button" class="ss-btn ss-btn-neutral"><i data-lucide="zoom-out" width="14" height="14" stroke-width="1.4"></i></button>
            <button type="button" class="ss-btn ss-btn-neutral">100%</button>
            <button type="button" class="ss-btn ss-btn-neutral"><i data-lucide="zoom-in" width="14" height="14" stroke-width="1.4"></i></button>
            <button type="button" class="ss-btn ss-btn-secondary"><i data-lucide="download" width="14" height="14" stroke-width="1.4"></i> Download</button>
            <a class="ss-btn ss-btn-ghost" href="information-permissions.html"><i data-lucide="lock" width="14" height="14" stroke-width="1.4"></i></a>
          </div>
        </div>
        <div class="ss-viewer-stage">
          <div class="ss-pdf-embed" role="img" aria-label="PDF preview placeholder">
            <i data-lucide="file-text" width="40" height="40" stroke-width="1.4"></i>
            <div style="font-weight:700;color:var(--ss-fg-primary);">Embedded PDF viewer</div>
            <div style="font-size:12px;max-width:320px;text-align:center;">Production embeds the PDF inline. Office types fall back to download from this chrome.</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script>lucide.createIcons();</script>

</body>
</html>
